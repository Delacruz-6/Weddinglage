spring:
  application:
    name: weddinglage-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:weddinglage}
    username: ${POSTGRES_USER:wedding}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: WEDDINGLAGE_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

weddinglage:
  token-pepper: ${TOKEN_PEPPER:dev-pepper-change-me}
  admin-email: ${ADMIN_EMAIL:admin@example.com}
  admin-password: ${ADMIN_PASSWORD:change-me-admin}
  max-failed-logins: ${MAX_FAILED_LOGINS:5}
  lockout-minutes: ${LOCKOUT_MINUTES:15}
  rsvp-rate-limit-per-minute: ${RSVP_RATE_LIMIT:30}
  open-rsvp-max-attendees: ${OPEN_RSVP_MAX_ATTENDEES:12}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minio}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-too}
    bucket: ${MINIO_BUCKET:wedding-photos}
    region: ${MINIO_REGION:us-east-1}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
