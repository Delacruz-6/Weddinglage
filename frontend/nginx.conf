server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the SPA shell so deploys show up after refresh.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets can be cached; SVG backgrounds should refresh with deploys.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location ~* \.svg$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
