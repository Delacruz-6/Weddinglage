<div class="wrap">
  <a routerLink="/" class="back">← Invitación</a>
  <header class="intro">
    <p class="eyebrow">Recuerdos</p>
    <h1>Galería</h1>
    <p class="lede">Fotos compartidas por los invitados, publicadas tras revisión.</p>
  </header>

  @if (loading()) {
    <p class="status">Cargando…</p>
  } @else if (photos().length) {
    <div class="grid">
      @for (p of photos(); track p.id) {
        <figure>
          <img [src]="src(p.id)" [alt]="'Foto ' + p.id" loading="lazy" />
        </figure>
      }
    </div>
  } @else {
    <p class="empty">{{ emptyMessage() || error() || 'Todavía no hay fotos publicadas.' }}</p>
  }
</div>
