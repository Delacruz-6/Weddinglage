<app-snow />
<div class="wrap">
  <a routerLink="/" class="back">← Inicio</a>
  <h1>Subir foto</h1>
  <p>Compartid un recuerdo del día. La foto se revisará antes de publicarse.</p>

  @if (token()) {
    <label class="file">
      Elegir imagen
      <input type="file" accept="image/*" (change)="onFile($event)" [disabled]="uploading()" />
    </label>
  }

  @if (uploading()) {
    <p>Subiendo…</p>
  }
  @if (message()) {
    <p class="ok">{{ message() }}</p>
  }
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</div>
