@if (tracks().length) {
  <div class="player" role="region" aria-label="Reproductor de música">
    <div class="meta">
      <span class="title">{{ current()?.title || 'Pista' }}</span>
      @if (current()?.artist) {
        <span class="artist">{{ current()?.artist }}</span>
      }
    </div>
    <div class="controls">
      <button type="button" class="icon-btn" (click)="prev()" aria-label="Anterior">‹</button>
      <button type="button" class="icon-btn play" (click)="togglePlay()" [attr.aria-label]="playing() ? 'Pausar' : 'Reproducir'">
        {{ playing() ? '❚❚' : '▶' }}
      </button>
      <button type="button" class="icon-btn" (click)="next()" aria-label="Siguiente">›</button>
      <button type="button" class="icon-btn" (click)="toggleMute()" [attr.aria-label]="muted() ? 'Activar sonido' : 'Silenciar'">
        {{ muted() ? '🔇' : '🔊' }}
      </button>
      <label class="vol">
        <span class="sr-only">Volumen</span>
        <input
          type="range"
          min="0"
          max="1"
          step="0.05"
          [value]="volume()"
          (input)="onVolume($event)"
        />
      </label>
    </div>
    @if (error()) {
      <p class="err">{{ error() }}</p>
    }
  </div>
}
