@if (visible()) {
  <div class="player" role="region" aria-label="Reproductor de música">
    <div class="meta">
      <span class="title">{{ displayTitle() }}</span>
    </div>

    <div class="progress-row">
      <span class="t">{{ formatMs(positionMs()) }}</span>
      <input
        class="seek"
        type="range"
        min="0"
        [max]="durationMs() || 1"
        [value]="positionMs()"
        (input)="onSeek($event)"
        [attr.aria-valuetext]="formatMs(positionMs())"
        aria-label="Progreso"
      />
      <span class="t">{{ formatMs(durationMs()) }}</span>
    </div>

    <div class="controls">
      <button type="button" class="icon-btn" (click)="prev()" aria-label="Anterior" [disabled]="tracks().length < 2">
        ‹
      </button>
      <button
        type="button"
        class="icon-btn play"
        (click)="togglePlay()"
        [attr.aria-label]="playing() ? 'Pausar' : 'Reproducir'"
      >
        {{ playing() ? '❚❚' : '▶' }}
      </button>
      <button type="button" class="icon-btn" (click)="next()" aria-label="Siguiente" [disabled]="tracks().length < 2">
        ›
      </button>
      <span class="bar" aria-hidden="true">
        <span class="fill" [style.width.%]="progressPercent()"></span>
      </span>
    </div>
  </div>
}
